<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rook Ops</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><div><p class="eyebrow">KVN LTD · OPERATIONS</p><h1>Rook Ops</h1><p class="sub">One live source of truth for delegation, blockers, retries, approvals, cost, and verified outcomes.</p></div><div class="top-actions"><span id="connection" class="connection">Connecting…</span><button id="newTaskBtn">New task</button></div></header>
<main><div id="notice" role="status" aria-live="polite"></div><section class="metrics" id="metrics"></section><section class="toolbar"><input id="searchInput" type="search" placeholder="Search tasks, owners, blockers…"><select id="filterSelect"><option value="all">All statuses</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="approval">Needs approval</option><option value="done">Done</option></select><button id="refreshBtn" class="ghost">Refresh</button></section><section id="board" class="board" aria-label="Task board"></section></main>
<dialog id="taskDialog"><form id="taskForm"><div class="dialog-head"><h2 id="dialogTitle">Task</h2><button type="button" class="icon-btn close" aria-label="Close">×</button></div><input id="taskId" type="hidden"><input id="taskVersion" type="hidden"><div class="form-grid"><label class="wide">Title<input id="taskTitle" required></label><label>Owner<input id="taskOwner" required></label><label>Priority<select id="taskPriority"><option>high</option><option>medium</option><option>low</option></select></label><label>Status<select id="taskStatus"><option value="todo">To do</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="approval">Needs approval</option><option value="done">Done</option></select></label><label>Approval required<select id="taskApproval"><option value="false">No</option><option value="true">Yes</option></select></label><label class="wide">Objective<textarea id="taskObjective"></textarea></label><label class="wide">Strategy / approach<textarea id="taskStrategy"></textarea></label><label class="wide">Current hypothesis<textarea id="taskHypothesis"></textarea></label><label class="wide">Blocker<textarea id="taskBlocker"></textarea></label><label class="wide">Approval detail<textarea id="taskApprovalDetail"></textarea></label><label class="wide">Next recommended action<textarea id="taskNext" required></textarea></label><label class="wide">Definition of done<textarea id="taskDone"></textarea></label><label class="wide">Verification evidence<textarea id="taskVerification"></textarea></label><label class="wide">Outcome<textarea id="taskOutcome"></textarea></label><label>Cost ($)<input id="taskCost" inputmode="decimal"></label><label>Credits used<input id="taskCredits" inputmode="decimal"></label></div><menu><button type="button" class="ghost close">Cancel</button><button type="submit">Save task</button></menu></form></dialog>
<dialog id="attemptDialog"><form id="attemptForm"><div class="dialog-head"><h2>Record attempt</h2><button type="button" class="icon-btn close-attempt" aria-label="Close">×</button></div><input id="attemptTaskId" type="hidden"><label>Outcome<select id="attemptOutcome"><option value="failed">Failed</option><option value="succeeded">Succeeded</option></select></label><label>Strategy used<textarea id="attemptStrategy" required></textarea></label><label>Hypothesis<textarea id="attemptHypothesis"></textarea></label><label>Evidence<textarea id="attemptEvidence"></textarea></label><label>Error<textarea id="attemptError"></textarea></label><div class="form-grid"><label>Cost ($)<input id="attemptCost" inputmode="decimal"></label><label>Credits used<input id="attemptCredits" inputmode="decimal"></label></div><menu><button type="button" class="ghost close-attempt">Cancel</button><button type="submit">Record attempt</button></menu></form></dialog><script src="app.js"></script></body></html>
